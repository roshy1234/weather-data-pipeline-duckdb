services:
  prefect-worker:
    image: roshyjamz/weather-pipeline-worker:latest
    container_name: prefect_weather_worker
    volumes:
      # Keeps your processed raw JSON files safely on your local machine
      - ./data:/app/data
    env_file:
      - .env
    restart: unless-stopped

  streamlit:
    image: roshyjamz/weather-streamlit-dashboard:latest
    container_name: weather_dashboard
    ports:
      - "8501:8501"
    env_file:       
      - .env
    restart: unless-stopped


