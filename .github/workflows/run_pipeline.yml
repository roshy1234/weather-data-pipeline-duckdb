name: Daily Weather Pipeline Execution
on:
  schedule:
    - cron: '0 8 * * *' # Runs daily at 8:00 AM UTC
  workflow_dispatch: # Allows manual runs from the GitHub UI

jobs:
  execute-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Run Pipeline Container
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          # Add any weather API keys here as well
        run: |
          docker run --rm \
            -e MOTHERDUCK_TOKEN="${MOTHERDUCK_TOKEN}" \
            ${{ secrets.DOCKERHUB_USERNAME }}/weather-pipeline-worker:latest